<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"><rect width="720" height="340" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ゲストの顔ぶれに合わせて選ぶ</text><text x="190" y="68" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#6e645a" text-anchor="middle" dominant-baseline="central">ゲストの顔ぶれ</text><text x="560" y="68" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#6e645a" text-anchor="middle" dominant-baseline="central">向いている方法</text><rect x="30" y="92" width="320" height="64" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="190" y="113" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">親族だけの少人数で</text><text x="190" y="135" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">LINE のグループがある</text><line x1="358" y1="124.0" x2="378" y2="124.0" stroke="#6e645a" stroke-width="2"/><path d="M376 117.0 L388 124.0 L376 131.0 Z" fill="#6e645a"/><rect x="396" y="92" width="294" height="64" rx="32" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="543" y="124.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">LINE のアルバム</text><rect x="30" y="170" width="320" height="64" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="190" y="191" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">Google フォトを使い慣れた</text><text x="190" y="213" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">友人が中心</text><line x1="358" y1="202.0" x2="378" y2="202.0" stroke="#6e645a" stroke-width="2"/><path d="M376 195.0 L388 202.0 L376 209.0 Z" fill="#6e645a"/><rect x="396" y="170" width="294" height="64" rx="32" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="543" y="202.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Google フォトの共有アルバム</text><rect x="30" y="248" width="320" height="64" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="190" y="269" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">幅広いゲストから元の画質や</text><text x="190" y="291" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">動画も集めたい</text><line x1="358" y1="280.0" x2="378" y2="280.0" stroke="#6e645a" stroke-width="2"/><path d="M376 273.0 L388 280.0 L376 287.0 Z" fill="#6e645a"/><rect x="396" y="248" width="294" height="64" rx="32" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="543" y="280.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">QR コードで集めるサービス</text></svg>