<svg xmlns="http://www.w3.org/2000/svg" width="720" height="254" viewBox="0 0 720 254"><rect width="720" height="254" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">QR コードで集めるサービスで確かめたいこと</text><rect x="30" y="66" width="320" height="46" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="56" cy="89.0" r="11" fill="#6b8f5e"/><path d="M51 89.0 L54.5 93.0 L61.5 85.0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="89.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">元の画質のまま届くか</text><rect x="370" y="66" width="320" height="46" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="396" cy="89.0" r="11" fill="#6b8f5e"/><path d="M391 89.0 L394.5 93.0 L401.5 85.0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="89.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">動画を送れるか、大きさの上限は</text><rect x="30" y="122" width="320" height="46" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="56" cy="145.0" r="11" fill="#6b8f5e"/><path d="M51 145.0 L54.5 149.0 L61.5 141.0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="145.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">いつまで受け取れて、いつまで残せるか</text><rect x="370" y="122" width="320" height="46" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="396" cy="145.0" r="11" fill="#6b8f5e"/><path d="M391 145.0 L394.5 149.0 L401.5 141.0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="145.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">届いた写真をまとめて保存できるか</text><rect x="30" y="178" width="320" height="46" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="56" cy="201.0" r="11" fill="#6b8f5e"/><path d="M51 201.0 L54.5 205.0 L61.5 197.0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="201.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">見せる範囲をゲストが選べるか</text><rect x="370" y="178" width="320" height="46" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="396" cy="201.0" r="11" fill="#6b8f5e"/><path d="M391 201.0 L394.5 205.0 L401.5 197.0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="201.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">会場のスクリーンに映せるか</text></svg>