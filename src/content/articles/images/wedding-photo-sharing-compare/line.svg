<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336"><rect width="720" height="336" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">LINE のアルバム</text><text x="190.0" y="68" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#6b8f5e" text-anchor="middle" dominant-baseline="central">向いているところ</text><text x="530.0" y="68" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#b5523b" text-anchor="middle" dominant-baseline="central">気をつけたいところ</text><rect x="30" y="92" width="320" height="46" rx="10" fill="#ffffff" stroke="#6b8f5e" stroke-width="2"/><text x="190.0" y="115.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">使い慣れているゲストが多い</text><rect x="370" y="92" width="320" height="46" rx="10" fill="#ffffff" stroke="#b5523b" stroke-width="2"/><text x="530.0" y="115.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">同じグループに入ってもらう必要がある</text><rect x="30" y="148" width="320" height="46" rx="10" fill="#ffffff" stroke="#6b8f5e" stroke-width="2"/><text x="190.0" y="171.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">グループがあればすぐ始められる</text><rect x="370" y="148" width="320" height="46" rx="10" fill="#ffffff" stroke="#b5523b" stroke-width="2"/><text x="530.0" y="171.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">会員でなければ通常画質の写真だけ</text><rect x="370" y="204" width="320" height="46" rx="10" fill="#ffffff" stroke="#b5523b" stroke-width="2"/><text x="530.0" y="227.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">動画は LYP プレミアムの会員だけ</text><rect x="370" y="260" width="320" height="46" rx="10" fill="#ffffff" stroke="#b5523b" stroke-width="2"/><text x="530.0" y="283.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">1 つのアルバムは 1,000 個まで</text></svg>