<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336"><rect width="720" height="336" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">Google フォトの共有アルバム</text><text x="190.0" y="68" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#6b8f5e" text-anchor="middle" dominant-baseline="central">向いているところ</text><text x="530.0" y="68" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#b5523b" text-anchor="middle" dominant-baseline="central">気をつけたいところ</text><rect x="30" y="92" width="320" height="46" rx="10" fill="#ffffff" stroke="#6b8f5e" stroke-width="2"/><text x="190.0" y="115.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">リンクや QR コードで共有できる</text><rect x="370" y="92" width="320" height="46" rx="10" fill="#ffffff" stroke="#b5523b" stroke-width="2"/><text x="530.0" y="115.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">リンクを知る人は誰でも閲覧と追加ができる</text><rect x="30" y="148" width="320" height="46" rx="10" fill="#ffffff" stroke="#6b8f5e" stroke-width="2"/><text x="190.0" y="171.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">1 つのアルバムに 20,000 個まで</text><rect x="370" y="148" width="320" height="46" rx="10" fill="#ffffff" stroke="#b5523b" stroke-width="2"/><text x="530.0" y="171.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">追加は Google アカウントで行う</text><rect x="30" y="204" width="320" height="46" rx="10" fill="#ffffff" stroke="#6b8f5e" stroke-width="2"/><text x="190.0" y="227.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">写真も動画も追加できる</text><rect x="370" y="204" width="320" height="46" rx="10" fill="#ffffff" stroke="#b5523b" stroke-width="2"/><text x="530.0" y="227.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">退出すると追加した写真も削除される</text><rect x="370" y="260" width="320" height="46" rx="10" fill="#ffffff" stroke="#b5523b" stroke-width="2"/><text x="530.0" y="283.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">保存すると保存容量にカウントされる</text></svg>