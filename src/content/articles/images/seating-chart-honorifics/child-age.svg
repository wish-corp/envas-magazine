no Mincho ProN', serif" font-size="17" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ちゃん</text><rect x="400" y="152" width="280" height="72" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="418" y="174" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6e645a" text-anchor="start" dominant-baseline="central">大人と同じ</text><text x="418" y="200" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">佐藤 大輝</text><rect x="624.0" y="185" width="42" height="30" rx="6" fill="#e7a03c" opacity="0.25"/><text x="645.0" y="200" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">様</text><rect x="110" y="300" width="500" height="70" rx="12" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><text x="360" y="324" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">迷ったら、お子さん全員に「様」でも失礼にならない</text><text x="360" y="350" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6e645a" text-anchor="middle" dominant-baseline="central">同じテーブルの中で書き方をそろえれば大丈夫</text></svg>