<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><rect width="720" height="400" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">1 画面に詰め込まず 短く分ける</text><rect x="40" y="70" width="280" height="158" rx="6" fill="#3a332e" stroke="#3a332e" stroke-width="2"/><rect x="60" y="88" width="240" height="9" rx="4" fill="#d9cfc2" stroke="#d9cfc2" stroke-width="0"/><rect x="60" y="109" width="222" height="9" rx="4" fill="#d9cfc2" stroke="#d9cfc2" stroke-width="0"/><rect x="60" y="130" width="204" height="9" rx="4" fill="#d9cfc2" stroke="#d9cfc2" stroke-width="0"/><rect x="60" y="151" width="240" height="9" rx="4" fill="#d9cfc2" stroke="#d9cfc2" stroke-width="0"/><rect x="60" y="172" width="222" height="9" rx="4" fill="#d9cfc2" stroke="#d9cfc2" stroke-width="0"/><rect x="60" y="193" width="204" height="9" rx="4" fill="#d9cfc2" stroke="#d9cfc2" stroke-width="0"/><path d="M169 241 L191 263 M191 241 L169 263" stroke="#b5523b" stroke-width="3.5" stroke-linecap="round"/><text x="180" y="286" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">長い文章を 1 画面に</text><text x="180" y="310" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">読み切る前に次の画面へ</text><rect x="400" y="70" width="280" height="74" rx="6" fill="#3a332e" stroke="#3a332e" stroke-width="2"/><text x="540" y="94" font-family="'Hiragino Mincho ProN', serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">今日はお越しいただき</text><text x="540" y="120" font-family="'Hiragino Mincho ProN', serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">ありがとうございます</text><rect x="400" y="154" width="280" height="74" r