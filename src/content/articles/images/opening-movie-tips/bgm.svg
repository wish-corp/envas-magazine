<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"><rect width="720" height="380" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">BGM は使える曲かどうかを先に確かめる</text><rect x="40" y="74" width="290" height="60" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="185" y="104" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">手続きなしで使える曲</text><line x1="340" y1="104" x2="390" y2="104" stroke="#6e645a" stroke-width="2"/><path d="M388 97 L400 104 L388 111 Z" fill="#6e645a"/><rect x="410" y="74" width="270" height="60" rx="10" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="545" y="104" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">そのまま使える</text><rect x="40" y="158" width="290" height="60" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="185" y="188" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">市販の CD や配信で買った曲</text><line x1="340" y1="188" x2="390" y2="188" stroke="#6e645a" stroke-width="2"/><path d="M388 181 L400 188 L388 195 Z" fill="#6e645a"/><rect x="410" y="158" width="270" height="60" rx="10" fill="#e7a03c" stroke="#e7a03c" stroke-width="2"/><text x="545" y="188" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ISUM などで手続きが要る</text><rect x="40" y="242" width="290" height="60" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="185" y="272" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">サブスクリプション配信の音源</text><line x1="340" y1="272" x2="390" y2="272" stroke="#6e645a" stroke-width="2"/><path d="M388 265 L400 272 L388 279 Z" fill="#6e645a"/><rect x="410" y="242" width="270" height="60" rx="10" fill="#b5523b" stroke="#b5523b" stroke-width="2"/><text x="545" y="272" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">使えない</text><text x="360" y="350" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">式場によっては手続きの代行を受け付けていることもある</text></svg>