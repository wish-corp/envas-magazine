<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"><rect width="720" height="420" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">1 か月前には完成させて 式場で確かめる</text><line x1="70" y1="120" x2="650" y2="120" stroke="#6e645a" stroke-width="2"/><circle cx="90" cy="120" r="10" fill="#ffffff"/><circle cx="90" cy="120" r="10" fill="#ffffff" stroke="#e7a03c" stroke-width="3"/><text x="90" y="88" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#6e645a" text-anchor="middle" dominant-baseline="central">2 か月前</text><text x="90" y="154" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">写真と文章を</text><text x="90" y="178" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">集める</text><circle cx="270" cy="120" r="10" fill="#e7a03c"/><circle cx="270" cy="120" r="10" fill="#e7a03c" stroke="#e7a03c" stroke-width="3"/><text x="270" y="88" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#b5523b" text-anchor="middle" dominant-baseline="central">1 か月前</text><text x="270" y="154" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ムービーを</text><text x="270" y="178" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">完成させる</text><circle cx="450" cy="120" r="10" fill="#ffffff"/><circle cx="450" cy="120" r="10" fill="#ffffff" stroke="#e7a03c" stroke-width="3"/><text x="450" y="88" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#6e645a" text-anchor="middle" dominant-baseline="central">式場の締め切り</text><text x="450" y="154" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">式場に渡して</text><text x="450" y="178" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">試写する</text><circle cx="630" cy="120" r="10" fill="#ffffff"/><circle cx="630" cy="120" r="10" fill="#ffffff" stroke="#e7a03c" stroke-width="3"/><text x="630" y="88" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#6e645a" text-anchor="middle" dominant-baseline="central">当日</text><text x="630" y="154" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">入場前に</text><text x="630" y="178" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">上映</text><line x1="30" y1="214" x2="690" y2="214" stroke="#e6dccd" stroke-width="2" stroke-dasharray="4 6"/><text x="360" y="244" font-family="'Hiragino Mincho ProN', serif" font-size="16" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">式場に確かめておくこと</text><rect x="60" y="266" width="600" height="128" rx="10" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><circle cx="92" cy="296" r="5" fill="#e7a03c"/><text x="106" y="296" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">ムービーを持ち込めるか、持ち込み料がかかるか</text><circle cx="92" cy="330" r="5" fill="#e7a03c"/><text x="106" y="330" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">渡すときの形式（DVD、Blu-ray、動画ファイルなど）</text><circle cx="92" cy="364" r="5" fill="#e7a03c"/><text x="106" y="364" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">会場の機材で前もって試写できるか</text></svg>