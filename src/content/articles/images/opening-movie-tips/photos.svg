<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"><rect width="720" height="420" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">スクリーンは横長 写真の向きで映り方が変わる</text><rect x="95" y="68" width="250" height="140" rx="6" fill="#3a332e" stroke="#3a332e" stroke-width="2"/><rect x="103" y="76" width="234" height="124" rx="3" fill="#f0c27e" stroke="#f0c27e" stroke-width="0"/><circle cx="220.0" cy="125.6" r="19.84" fill="#ffffff"/><path d="M180.32 200 Q220.0 138.0 259.68 200 Z" fill="#ffffff"/><circle cx="220" cy="232" r="13" fill="none" stroke="#6b8f5e" stroke-width="3.5"/><text x="220" y="264" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">横向きの写真は</text><text x="220" y="288" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">画面いっぱいに映る</text><rect x="375" y="68" width="250" height="140" rx="6" fill="#3a332e" stroke="#3a332e" stroke-width="2"/><rect x="461" y="76" width="78" height="124" rx="3" fill="#e8b4b8" stroke="#e8b4b8" stroke-width="0"/><circle cx="500.0" cy="125.6" r="12.48" fill="#ffffff"/><path d="M475.04 200 Q500.0 138.0 524.96 200 Z" fill="#ffffff"/><text x="416" y="138" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="600" fill="#bdb3a7" text-anchor="middle" dominant-baseline="central">余白</text><text x="584" y="138" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="600" fill="#bdb3a7" text-anchor="middle" dominant-baseline="central">余白</text><text x="500" y="232" font-family="'Hiragino Sans', sans-serif" font-size="26" font-weight="700" fill="#e7a03c" text-anchor="middle" dominant-baseline="central">△</text><text x="500" y="264" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">縦向きは顔が切れないよう</text><text x="500" y="288" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">映す範囲を確かめる</text><rect x="60" y="318" width="600" height="84" rx="10" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><circle cx="92" cy="344" r="5" fill="#e7a03c"/><text x="106" y="344" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">顔がはっきり写っている</text><circle cx="92" cy="376" r="5" fill="#e7a03c"/><text x="106" y="376" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">明るく、ピントが合っている</text><circle cx="392" cy="344" r="5" fill="#e7a03c"/><text x="406" y="344" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">新郎と新婦で枚数をそろえる</text><circle cx="392" cy="376" r="5" fill="#e7a03c"/><text x="406" y="376" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">小さくなっていない元の写真</text></svg>