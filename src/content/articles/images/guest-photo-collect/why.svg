<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370"><rect width="720" height="370" fill="#fffdf9"/><text x="360" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ゲストの写真には、おふたりが見られなかった場面が残る</text><rect x="40" y="70" width="300" height="210" rx="12" fill="#ffffff" stroke="#6b8f5e" stroke-width="2"/><path d="M40 82 Q40 70 52 70 H328 Q340 70 340 82 V118 H40 Z" fill="#6b8f5e"/><text x="190" y="94" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">カメラマンの写真</text><text x="190" y="150" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">式の流れを押さえた写真</text><text x="190" y="194" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">おふたりが主役</text><text x="190" y="238" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">入場や誓いの場面</text><rect x="380" y="70" width="300" height="210" rx="12" fill="#ffffff" stroke="#e7a03c" stroke-width="2"/><path d="M380 82 Q380 70 392 70 H668 Q680 70 680 82 V118 H380 Z" fill="#e7a03c"/><text x="530" y="94" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">ゲストの写真</text><text x="530" y="150" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">席から見た景色</text><text x="530" y="194" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ゲストどうしの笑顔</text><text x="530" y="238" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">おふたりが見ていない場面</text><rect x="60" y="300" width="600" height="46" rx="10" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><text x="360" y="323" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">両方がそろうと、当日をまるごと振り返れる</text></svg>