<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"><rect width="720" height="290" fill="#fffdf9"/><text x="360" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">集める前に決めておきたい 4 つのこと</text><rect x="30" y="70" width="150" height="120" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="105.0" cy="98" r="14" fill="#e7a03c"/><text x="105.0" y="98" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text><text x="105.0" y="134" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">集める場所</text><text x="105.0" y="164" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">ひとつにまとめる</text><rect x="200" y="70" width="150" height="120" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="275.0" cy="98" r="14" fill="#e7a03c"/><text x="275.0" y="98" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text><text x="275.0" y="134" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">期限</text><text x="275.0" y="164" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">いつまでに送るか</text><rect x="370" y="70" width="150" height="120" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="445.0" cy="98" r="14" fill="#e7a03c"/><text x="445.0" y="98" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text><text x="445.0" y="134" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">画質</text><text x="445.0" y="164" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">元の画質で残すか</text><rect x="540" y="70" width="150" height="120" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="615.0" cy="98" r="14" fill="#e7a03c"/><text x="615.0" y="98" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text><text x="615.0" y="134" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">見せる範囲</text><text x="615.0" y="164" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">誰が見られるか</text><rect x="60" y="216" width="600" height="46" rx="10" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><text x="360" y="239" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ゲストに案内する前に決めておくと、迷わず送ってもらえる</text></svg>