<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"><rect width="720" height="320" fill="#fffdf9"/><text x="360" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">envas なら QR コードから写真が集まる</text><rect x="40.0" y="70" width="194.67" height="96" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="137.33499999999998" cy="96" r="14" fill="#e7a03c"/><text x="137.33499999999998" y="96" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text><text x="137.33499999999998" y="128" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">QR コードを用意する</text><text x="137.33499999999998" y="150" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">受付や席札で案内する</text><line x1="238.67" y1="118" x2="248.66999999999996" y2="118" stroke="#6e645a" stroke-width="2"/><path d="M246.66999999999996 111 L258.66999999999996 118 L246.66999999999996 125 Z" fill="#6e645a"/><rect x="262.66999999999996" y="70" width="194.67" height="96" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="360.00499999999994" cy="96" r="14" fill="#e7a03c"/><text x="360.00499999999994" y="96" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text><text x="360.00499999999994" y="128" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ゲストが写真を送る</text><text x="360.00499999999994" y="150" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">その場でページに並ぶ</text><line x1="461.3399999999999" y1="118" x2="471.3399999999999" y2="118" stroke="#6e645a" stroke-width="2"/><path d="M469.3399999999999 111 L481.3399999999999 118 L469.3399999999999 125 Z" fill="#6e645a"/><rect x="485.34" y="70" width="194.67" height="96" rx="10" fill="#ffffff" stroke="#e7a03c" stroke-width="2"/><circle cx="582.675" cy="96" r="14" fill="#e7a03c"/><text x="582.675" y="96" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text><text x="582.675" y="128" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">まとめて保存する</text><text x="582.675" y="150" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">元の画質のまま</text><line x1="30" y1="196" x2="690" y2="196" stroke="#e6dccd" stroke-width="2" stroke-dasharray="4 6"/><rect x="40" y="222" width="200" height="70" rx="35" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="140.0" y="257" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">登録もアプリも不要</text><rect x="260" y="222" width="200" height="70" rx="35" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="360.0" y="257" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">新郎新婦だけに見せられる</text><rect x="480" y="222" width="200" height="70" rx="35" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="580.0" y="257" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">メッセージを添えられる</text></svg>