<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390"><rect width="720" height="390" fill="#fffdf9"/><text x="360" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">写真を集める主な方法と向き不向き</text><text x="275" y="72" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#6b8f5e" text-anchor="middle" dominant-baseline="central">向いているところ</text><text x="530" y="72" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#b5523b" text-anchor="middle" dominant-baseline="central">気をつけたいところ</text><rect x="30" y="92" width="660" height="52" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="110" y="118" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">共有アルバム</text><line x1="190" y1="102" x2="190" y2="134" stroke="#e6dccd" stroke-width="2"/><text x="300" y="118" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">みんなで同じアルバムに足せる</text><text x="545" y="118" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">アカウントやアプリが要ることがある</text><rect x="30" y="154" width="660" height="52" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="110" y="180" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">LINE のアルバム</text><line x1="190" y1="164" x2="190" y2="196" stroke="#e6dccd" stroke-width="2"/><text x="300" y="180" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">使い慣れている方が多い</text><text x="545" y="180" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">同じグループに入ってもらう必要がある</text><rect x="30" y="216" width="660" height="52" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="110" y="242" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">AirDrop</text><line x1="190" y1="226" x2="190" y2="258" stroke="#e6dccd" stroke-width="2"/><text x="300" y="242" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">その場で送ってもらえる</text><text x="545" y="242" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">近くの iPhone どうしに限られる</text><rect x="30" y="278" width="660" height="52" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="110" y="304" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">後日送ってもらう</text><line x1="190" y1="288" x2="190" y2="320" stroke="#e6dccd" stroke-width="2"/><text x="300" y="304" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ゲストの準備が要らない</text><text x="545" y="304" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">集め漏れが出やすい</text><text x="360" y="362" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">どの方法でも、写真が縮められて届くことがないか確かめておく</text></svg>