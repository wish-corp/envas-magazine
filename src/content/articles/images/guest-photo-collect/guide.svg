<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270"><rect width="720" height="270" fill="#fffdf9"/><text x="360" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">撮ったその場で送ってもらう</text><rect x="40" y="76" width="190" height="96" rx="10" fill="#ffffff" stroke="#e7a03c" stroke-width="2"/><text x="135.0" y="108" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">受付</text><text x="135.0" y="142" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">QR コードのカードを置く</text><line x1="236" y1="124" x2="259" y2="124" stroke="#6e645a" stroke-width="2"/><path d="M257 117 L269 124 L257 131 Z" fill="#6e645a"/><rect x="275" y="76" width="190" height="96" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="370.0" y="108" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">乾杯のあと</text><text x="370.0" y="142" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">司会からひとこと添える</text><line x1="471" y1="124" x2="494" y2="124" stroke="#6e645a" stroke-width="2"/><path d="M492 117 L504 124 L492 131 Z" fill="#6e645a"/><rect x="510" y="76" width="190" height="96" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="605.0" y="108" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">お見送り</text><text x="605.0" y="142" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">写真をお願いする</text><rect x="60" y="200" width="600" height="46" rx="10" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><text x="360" y="223" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">席札やエスコートカード、プロフィールブックにも QR コードを載せる</text></svg>