<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"><rect width="720" height="330" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">envas なら素材とコメントを入れるだけ</text><rect x="40.0" y="70" width="194.66666666666666" height="96" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="137.33333333333331" cy="96" r="14" fill="#e7a03c"/><text x="137.33333333333331" y="96" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text><text x="137.33333333333331" y="128" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">写真か動画を入れる</text><text x="137.33333333333331" y="150" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">42 の枠に 1 つずつ</text><line x1="238.66666666666666" y1="118" x2="250.66666666666663" y2="118" stroke="#6e645a" stroke-width="2"/><path d="M248.66666666666663 111 L260.66666666666663 118 L248.66666666666663 125 Z" fill="#6e645a"/><rect x="262.66666666666663" y="70" width="194.66666666666666" height="96" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="359.99999999999994" cy="96" r="14" fill="#e7a03c"/><text x="359.99999999999994" y="96" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text><text x="359.99999999999994" y="128" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">コメントを書く</text><text x="359.99999999999994" y="150" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">1 枚に 2 行まで</text><line x1="461.33333333333326" y1="118" x2="473.33333333333326" y2="118" stroke="#6e645a" stroke-width="2"/><path d="M471.33333333333326 111 L483.33333333333326 118 L471.33333333333326 125 Z" fill="#6e645a"/><rect x="485.3333333333333" y="70" width="194.66666666666666" height="96" rx="10" fill="#ffffff" stroke="#e7a03c" stroke-width="2"/><circle cx="582.6666666666666" cy="96" r="14" fill="#e7a03c"/><text x="582.6666666666666" y="96" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text><text x="582.6666666666666" y="128" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">動画を書き出す</text><text x="582.6666666666666" y="150" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">約 4 分 9 秒で完成</text><line x1="30" y1="196" x2="690" y2="196" stroke="#e6dccd" stroke-width="2" stroke-dasharray="4 6"/><rect x="60.0" y="222" width="186.66666666666666" height="70" rx="35" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="153.33333333333331" y="257" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">依頼しなくていい</text><rect x="266.66666666666663" y="222" width="186.66666666666666" height="70" rx="35" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="359.99999999999994" y="257" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">編集の知識は要らない</text><rect x="473.3333333333333" y="222" width="186.66666666666666" height="70" rx="35" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="566.6666666666666" y="257" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="