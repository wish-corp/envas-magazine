<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><rect width="720" height="400" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">年代順に並べて ゲストが写っている写真を入れる</text><line x1="50" y1="120" x2="670" y2="120" stroke="#6e645a" stroke-width="2"/><path d="M668 113 L680 120 L668 127 Z" fill="#6e645a"/><rect x="58" y="70" width="64" height="40" rx="3" fill="#f0c27e" stroke="#f0c27e" stroke-width="0"/><circle cx="90.0" cy="86.0" r="6.4" fill="#ffffff"/><path d="M77.2 110 Q90.0 90.0 102.8 110 Z" fill="#ffffff"/><circle cx="90" cy="120" r="6" fill="#e7a03c"/><text x="90" y="144" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">誕生</text><rect x="193" y="70" width="64" height="40" rx="3" fill="#f0c27e" stroke="#f0c27e" stroke-width="0"/><circle cx="225.0" cy="86.0" r="6.4" fill="#ffffff"/><path d="M212.2 110 Q225.0 90.0 237.8 110 Z" fill="#ffffff"/><circle cx="225" cy="120" r="6" fill="#e7a03c"/><text x="225" y="144" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">幼少期</text><rect x="328" y="70" width="64" height="40" rx="3" fill="#e8b4b8" stroke="#e8b4b8" stroke-width="0"/><circle cx="360.0" cy="86.0" r="6.4" fill="#ffffff"/><path d="M347.2 110 Q360.0 90.0 372.8 110 Z" fill="#ffffff"/><circle cx="360" cy="120" r="6" fill="#e7a03c"/><text x="360" y="144" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">学生時代</text><rect x="463" y="70" width="64" height="40" rx="3" fill="#e8b4b8" stroke="#e8b4b8" stroke-width="0"/><circle cx="495.0" cy="86.0" r="6.4" fill="#ffffff"/><path d="M482.2 110 Q495.0 90.0 507.8 110 Z" fill="#ffffff"/><circle cx="495" cy="120" r="6" fill="#e7a03c"/><text x="495" y="144" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">社会人</text><rect x="598" y="70" width="64" height="40" rx="3" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="0"/><circle cx="630.0" cy="86.0" r="6.4" fill="#ffffff"/><path d="M617.2 110 Q630.0 90.0 642.8 110 Z" fill="#ffffff"/><circle cx="630" cy="120" r="6" fill="#e7a03c"/><text x="630" y="144" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ふたり</text><rect x="40" y="186" width="400" height="190" rx="10" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><text x="240" y="214" font-family="'Hiragino Mincho ProN', serif" font-size="16" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">入れると盛り上がる写真</text><circle cx="70" cy="250" r="5" fill="#e7a03c"/><text x="84" y="250" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">ゲストと一緒に写っている</text><circle cx="70" cy="284" r="5" fill="#e7a03c"/><text x="84" y="284" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">部活や習い事に夢中だった頃</text><circle cx="70" cy="318" r="5" fill="#e7a03c"/><text x="84" y="318" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">家族との思い出</text><circle cx="70" cy="352" r="5" fill="#e7a03c"/><text x="84" y="352" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">数秒の動画も入れられる</text><rect x="460" y="186" width="220" height="190" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="570" y="214" font-family="'Hiragino Mincho ProN', serif" font-size="16" font-weight