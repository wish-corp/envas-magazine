<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"><rect width="720" height="380" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">コメントは 1 枚に 1〜2 行 気持ちを添える</text><rect x="40" y="70" width="300" height="169" rx="6" fill="#3a332e" stroke="#3a332e" stroke-width="2"/><rect x="48" y="78" width="284" height="153" rx="3" fill="#d9cfc2" stroke="#d9cfc2" stroke-width="0"/><circle cx="190.0" cy="139.2" r="24.48" fill="#ffffff"/><path d="M141.04 231 Q190.0 154.5 238.96 231 Z" fill="#ffffff"/><rect x="58" y="191" width="264" height="34" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="190" y="207" font-family="'Hiragino Mincho ProN', serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">小学校の入学式</text><text x="190" y="266" font-family="'Hiragino Sans', sans-serif" font-size="26" font-weight="700" fill="#e7a03c" text-anchor="middle" dominant-baseline="central">△</text><text x="190" y="300" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">説明だけ</text><rect x="380" y="70" width="300" height="169" rx="6" fill="#3a332e" stroke="#3a332e" stroke-width="2"/><rect x="388" y="78" width="284" height="153" rx="3" fill="#f0c27e" stroke="#f0c27e" stroke-width="0"/><circle cx="530.0" cy="139.2" r="24.48" fill="#ffffff"/><path d="M481.04 231 Q530.0 154.5 578.96 231 Z" fill="#ffffff"/><rect x="398" y="169" width="264" height="56" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="530" y="185" font-family="'Hiragino Mincho ProN', serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ランドセルが大きく見えた入学式</text><text x="530" y="207" font-family="'Hiragino Mincho ProN', serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">母が一番うれしそうでした</text><circle cx="530" cy="266" r="13" fill="none" stroke="#6b8f5e" stroke-width="3.5"/><text x="530" y="300" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">気持ちが伝わる</text><text x="210" y="328" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">何の写真かはわかるが印象に残りにくい</text><text x="530" y="328" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">そのときの気持ちで人柄が伝わる</text></svg>