<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384"><rect width="720" height="384" fill="#fffdf9"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e645a"/></marker></defs><text x="360.0" y="36.0" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">envas なら表示設定で選ぶだけ</text><rect x="35" y="80" width="190" height="150" rx="12" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="130" cy="116" r="18" fill="#e7a03c"/><text x="130.0" y="116.0" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text><text x="130.0" y="166.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">表示設定を開く</text><text x="130.0" y="198.0" font-family="'Hiragino Sans', sans-serif" font-size="12" font-weight="400" fill="#6e645a" text-anchor="middle" dominant-baseline="central">席次表エディタの右上</text><path d="M 230 155 L 258 155" stroke="#6e645a" stroke-width="2" marker-end="url(#arrow)"/><rect x="265" y="80" width="190" height="150" rx="12" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="360" cy="116" r="18" fill="#e7a03c"/><text x="360.0" y="116.0" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text><text x="360.0" y="166.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ゲストの配置を選ぶ</text><text x="360.0" y="198.0" font-family="'Hiragino Sans', sans-serif" font-size="12" font-weight="400" fill="#6e645a" text-anchor="middle" dominant-baseline="central">左右に並べる / 囲む</text><path d="M 460 155 L 488 155" stroke="#6e645a" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="80" width="190" height="150" rx="12" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="590" cy="116" r="18" fill="#e7a03c"/><text x="590.0" y="116.0" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text><text x="590.0" y="166.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">画像と公開ページに</text><text x="590.0" y="198.0" font-family="'Hiragino Sans', sans-serif" font-size="12" font-weight="400" fill="#6e645a" text-anchor="middle" dominant-baseline="central">同じ並べ方で出る</text><rect x="100.0" y="263" width="520" height="34" rx="17" fill="#f7e2c0"/><text x="360.0" y="280.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">並べ方を変えても、ゲストが座る左右はそのまま</text><rect x="100.0" y="317" width="520" height="34" rx="17" fill="#f5ede1"/><text x="360.0" y="334.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">名前の大きさは、どちらの並べ方でもほぼ同じ</text></svg>