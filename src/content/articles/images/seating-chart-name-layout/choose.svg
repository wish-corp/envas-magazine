<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384"><rect width="720" height="384" fill="#fffdf9"/><text x="360.0" y="36.0" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">どちらが向いているかの目安</text><rect x="230.0" y="63" width="200" height="34" rx="17" fill="#f7e2c0"/><text x="330.0" y="80.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">左右に並べる</text><rect x="460.0" y="63" width="200" height="34" rx="17" fill="#f7e2c0"/><text x="560.0" y="80.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">まわりを囲む</text><rect x="40" y="114" width="640" height="44" rx="8" fill="#f5ede1"/><text x="60.0" y="136.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">1 卓の人数</text><text x="330.0" y="136.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">8 名以上が多い</text><text x="560.0" y="136.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">6 名前後が多い</text><rect x="40" y="170" width="640" height="44" rx="8" fill="#fffdf9"/><text x="60.0" y="192.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">テーブルの数</text><text x="330.0" y="192.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">多い</text><text x="560.0" y="192.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">少なめ</text><rect x="40" y="226" width="640" height="44" rx="8" fill="#f5ede1"/><text x="60.0" y="248.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">名前や肩書き</text><text x="330.0" y="248.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">長いものが多い</text><text x="560.0" y="248.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">短いものが多い</text><rect x="40" y="282" width="640" height="44" rx="8" fill="#fffdf9"/><text x="60.0" y="304.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">見せたい印象</text><text x="330.0" y="304.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">読みやすさ</text><text x="560.0" y="304.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">会場の雰囲気</text><text x="360.0" y="364.0" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6e645a" text-anchor="middle" dominant-baseline="central">迷ったら両方で並べて見比べ、両家でも確かめる</text></svg>