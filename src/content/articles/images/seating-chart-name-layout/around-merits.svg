ill="#2a2420" text-anchor="start" dominant-baseline="central">実際の座り方に近い</text><circle cx="430" cy="170" r="15" fill="#6b8f5e"/><text x="430.0" y="170.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">○</text><text x="456.0" y="170.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">自分の席の場所を思い浮かべやすい</text><circle cx="430" cy="250" r="15" fill="#b5523b"/><text x="430.0" y="250.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">△</text><text x="456.0" y="250.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">1 卓の人数が多いと名前が詰まる</text><circle cx="430" cy="310" r="15" fill="#b5523b"/><text x="430.0" y="310.0" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">△</text><text x="456.0" y="310.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">長い名前は場所を取りやすい</text></svg>