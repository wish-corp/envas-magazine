<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390"><rect width="720" height="390" fill="#fffdf9"/><text x="360" y="36" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">ゲスト一覧で並べて見比べる</text><rect x="60" y="62" width="600" height="44" rx="0" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><text x="80" y="84" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#6e645a" text-anchor="start" dominant-baseline="central">ゲスト名</text><text x="330" y="84" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#6e645a" text-anchor="start" dominant-baseline="central">敬称</text><text x="470" y="84" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#6e645a" text-anchor="start" dominant-baseline="central">肩書き</text><rect x="60" y="106" width="600" height="52" fill="#ffffff" stroke="#e6dccd"/><text x="80" y="132" font-family="'Hiragino Mincho ProN', serif" font-size="16" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">山田 太郎</text><text x="330" y="132" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="400" fill="#2a2420" text-anchor="start" dominant-baseline="central">様</text><text x="470" y="132" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">新郎友人</text><rect x="60" y="158" width="600" height="52" fill="#fbeeea" stroke="#e6dccd"/><text x="80" y="184" font-family="'Hiragino Mincho ProN', serif" font-size="16" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">佐藤 健</text><text x="330" y="184" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="400" fill="#2a2420" text-anchor="start" dominant-baseline="central">様</text><text x="470" y="184" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#b5523b" text-anchor="start" dominant-baseline="central">新郎大学友人</text><rect x="60" y="210" width="600" height="52" fill="#ffffff" stroke="#e6dccd"/><text x="80" y="236" font-family="'Hiragino Mincho ProN', serif" font-size="16" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">鈴木 一郎</text><text x="330" y="236" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="400" fill="#2a2420" text-anchor="start" dominant-baseline="central">様</text><text x="470" y="236" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="600" fill="#2a2420" text-anchor="start" dominant-baseline="central">新郎友人</text><text x="360" y="288" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#b5523b" text-anchor="middle" dominant-baseline="central">ひとりだけ書き方が違うと、ゲストが気にしてしまうことも</text><rect x="110" y="318" width="500" height="46" rx="23" fill="#f7e2c0" stroke="#f7e2c0" stroke-width="2"/><text x="360" y="341" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">同じような関係の人は、同じ書き方にそろえる</text></svg>