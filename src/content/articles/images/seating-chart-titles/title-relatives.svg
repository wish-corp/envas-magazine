<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"><rect width="720" height="450" fill="#fffdf9"/><text x="360" y="38" font-family="'Hiragino Mincho ProN', serif" font-size="16" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">「おじ」「おば」の漢字は、親より年上か年下かで変わる</text><rect x="40" y="80" width="180" height="56" rx="12" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><text x="130" y="108" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">親の兄・姉</text><rect x="270" y="80" width="180" height="56" rx="12" fill="#ffffff" stroke="#e7a03c" stroke-width="2"/><text x="360" y="108" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">親</text><rect x="500" y="80" width="180" height="56" rx="12" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><text x="590" y="108" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">親の弟・妹</text><line x1="220" y1="108" x2="270" y2="108" stroke="#6e645a" stroke-width="2"/><line x1="450" y1="108" x2="500" y2="108" stroke="#6e645a" stroke-width="2"/><line x1="360" y1="136" x2="360" y2="180" stroke="#6e645a" stroke-width="2"/><rect x="290" y="180" width="140" height="46" rx="23" fill="#f0c27e" stroke="#f0c27e" stroke-width="2"/><text x="360" y="203" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">おふたり</text><text x="130" y="160" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">年上</text><text x="590" y="160" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">年下</text><rect x="40" y="250" width="180" height="64" rx="12" fill="#ffffff" stroke="#96580a" stroke-width="2"/><text x="130" y="282" font-family="'Hiragino Mincho ProN', serif" font-size="22" font-weight="700" fill="#96580a" text-anchor="middle" dominant-baseline="central">伯父・伯母</text><rect x="500" y="250" width="180" height="64" rx="12" fill="#ffffff" stroke="#96580a" stroke-width="2"/><text x="590" y="282" font-family="'Hiragino Mincho ProN', serif" font-size="22" font-weight="700" fill="#96580a" text-anchor="middle" dominant-baseline="central">叔父・叔母</text><line x1="130" y1="176" x2="130" y2="236" stroke="#6e645a" stroke-width="2"/><path d="M123 234 L130 246 L137 234 Z" fill="#6e645a"/><line x1="590" y1="176" x2="590" y2="236" stroke="#6e645a" stroke-width="2"/><path d="M583 234 L590 246 L597 234 Z" fill="#6e645a"/><text x="360" y="352" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">いとこは「新郎いとこ」とひらがなで書いても失礼にならない</text><rect x="170" y="380" width="380" height="44" rx="22" fill="#f7e2c0" stroke="#f7e2c0" stroke-width="2"/><text x="360" y="402" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">迷ったら親に確認するのが確実</text></svg>