<svg xmlns="http://www.w3.org/2000/svg" width="720" height="504" viewBox="0 0 720 504"><rect width="720" height="504" fill="#fffdf9"/><text x="360.0" y="36" font-family="'Hiragino Mincho ProN', serif" font-size="19" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">envas の WEB 席次表</text><rect x="32" y="62" width="316" height="72" rx="10" fill="#f7e2c0" stroke="#e7a03c" stroke-width="2"/><text x="190" y="86" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">9,800 円</text><text x="190" y="112" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#6e645a" text-anchor="middle" dominant-baseline="central">お支払いは一度だけ</text><rect x="372" y="62" width="316" height="72" rx="10" fill="#f7e2c0" stroke="#e7a03c" stroke-width="2"/><text x="530" y="86" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">人数で変わらない</text><text x="530" y="112" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#6e645a" text-anchor="middle" dominant-baseline="central">ゲストが多くても同じ料金</text><rect x="32" y="146" width="316" height="72" rx="10" fill="#f7e2c0" stroke="#e7a03c" stroke-width="2"/><text x="190" y="170" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">当日まで何度でも</text><text x="190" y="196" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#6e645a" text-anchor="middle" dominant-baseline="central">修正に追加の費用なし</text><rect x="372" y="146" width="316" height="72" rx="10" fill="#f7e2c0" stroke="#e7a03c" stroke-width="2"/><text x="530" y="170" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">受付の QR コード</text><text x="530" y="196" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#6e645a" text-anchor="middle" dominant-baseline="central">ゲストは自分のスマホで見る</text><rect x="32" y="246" width="656" height="176" rx="12" fill="#f5ede1" stroke="none" stroke-width="0"/><text x="360" y="274" font-family="'Hiragino Mincho ProN', serif" font-size="16" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">スマートフォンに慣れていないゲストがいるときは</text><rect x="64" y="302" width="288" height="96" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="208" y="336" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">席次表を画像でダウンロード</text><text x="208" y="366" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#6e645a" text-anchor="middle" dominant-baseline="central">印刷して会場に貼り出せる</text><rect x="368" y="302" width="288" height="96" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="512" y="336" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">エスコートカードの印刷</text><text x="512" y="366" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#6e645a" text-anchor="middle" dominant-baseline="central">QR コード入りのカードが届く</text><rect x="210" y="444" width="300" height="36" rx="18" fill="#6b8f5e"/><text x="360" y="462" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">編集とプレビューは無料</text></svg>