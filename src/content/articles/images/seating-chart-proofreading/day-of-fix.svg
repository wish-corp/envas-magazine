<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354"><rect width="720" height="354" fill="#fffdf9"/><text x="360.0" y="36" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">紙の席次表で間違いが見つかったとき</text><rect x="60" y="70" width="380" height="72" rx="12" fill="#e7a03c" stroke="#e7a03c" stroke-width="2"/><circle cx="96" cy="106" r="13" fill="#ffffff"/><text x="96" y="106" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#96580a" text-anchor="middle" dominant-baseline="central">1</text><text x="126" y="94" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start" dominant-baseline="central">間違いのあったゲストに</text><text x="126" y="120" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start" dominant-baseline="central">直接お詫びする</text><text x="470" y="106" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#96580a" text-anchor="start" dominant-baseline="central">まずはこれがいちばん</text><rect x="60" y="162" width="380" height="72" rx="12" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="96" cy="198" r="13" fill="#96580a"/><text x="96" y="198" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text><text x="126" y="186" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">正しい名前を書いた</text><text x="126" y="212" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#2a2420" text-anchor="start" dominant-baseline="central">小さな紙を貼る</text><text x="470" y="198" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">人数が少ないとき</text><rect x="60" y="254" width="380" height="72" rx="12" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="96" cy="290" r="13" fill="#96580a"/><text x="96" y="290" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text><text x="126" y="278" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">会場のスタッフに</text><text x="126" y="304" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#2a2420" text-anchor="start" dominant-baseline="central">相談する</text><text x="470" y="290" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">対応を手伝ってもらえることも</text></svg>