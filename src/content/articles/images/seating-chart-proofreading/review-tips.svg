<svg xmlns="http://www.w3.org/2000/svg" width="720" height="324" viewBox="0 0 720 324"><rect width="720" height="324" fill="#fffdf9"/><text x="360.0" y="36" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">目線を変えて見直す 4 つの方法</text><rect x="40" y="70" width="310" height="100" rx="12" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><circle cx="74" cy="120" r="13" fill="#96580a"/><text x="74" y="120" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text><text x="102" y="107" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">おふたりそれぞれが</text><text x="102" y="135" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="start" dominant-baseline="central">全員分を見直す</text><rect x="370" y="70" width="310" height="100" rx="12" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><circle cx="404" cy="120" r="13" fill="#96580a"/><text x="404" y="120" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text><text x="432" y="107" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">両家の親にも見てもらい</text><text x="432" y="135" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="start" dominant-baseline="central">親族の名前や続柄を確認</text><rect x="40" y="190" width="310" height="100" rx="12" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><circle cx="74" cy="240" r="13" fill="#96580a"/><text x="74" y="240" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text><text x="102" y="227" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">ゲストリストとひとりずつ</text><text x="102" y="255" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="start" dominant-baseline="central">照らし合わせる</text><rect x="370" y="190" width="310" height="100" rx="12" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><circle cx="404" cy="240" r="13" fill="#96580a"/><text x="404" y="240" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text><text x="432" y="227" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#6e645a" text-anchor="start" dominant-baseline="central">テーブルごとの人数を数え</text><text x="432" y="255" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="start" dominant-baseline="central">会場の席数と合わせる</text></svg>