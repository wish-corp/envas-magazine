="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">髙橋 誠</text><text x="495" y="306" font-family="'Hiragino Mincho ProN', serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">様</text><circle cx="562" cy="184" r="15" fill="#6b8f5e"/><text x="562" y="184" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">○</text><text x="360.0" y="408" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">名前、敬称、肩書きを直すと、公開している席次表にもすぐ反映される</text></svg>