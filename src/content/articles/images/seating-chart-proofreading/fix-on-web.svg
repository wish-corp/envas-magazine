<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432"><rect width="720" height="432" fill="#fffdf9"/><text x="360.0" y="36" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">envas なら受付の前に直しておける</text><rect x="30" y="70" width="200" height="70" rx="12" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="130" y="94" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">当日の朝</text><text x="130" y="119" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">間違いに気づく</text><line x1="234" y1="105" x2="246" y2="105" stroke="#6e645a" stroke-width="2"/><path d="M244 98 L256 105 L244 112 Z" fill="#6e645a"/><rect x="260" y="70" width="200" height="70" rx="12" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="360" y="94" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">ゲスト一覧で</text><text x="360" y="119" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">名前を直す</text><line x1="464" y1="105" x2="476" y2="105" stroke="#6e645a" stroke-width="2"/><path d="M474 98 L486 105 L474 112 Z" fill="#6e645a"/><rect x="490" y="70" width="200" height="70" rx="12" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="590" y="94" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">公開中の席次表に</text><text x="590" y="119" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">すぐ反映</text><rect x="150" y="176" width="150" height="200" rx="16" fill="#fffff