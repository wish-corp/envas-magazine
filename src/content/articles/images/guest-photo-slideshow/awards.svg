<svg xmlns="http://www.w3.org/2000/svg" width="720" height="266" viewBox="0 0 720 266"><rect width="720" height="266" fill="#fffdf9"/><text x="360.0" y="34" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">賞の発表はスタッフがリモコンで</text><rect x="40.0" y="70" width="194.67" height="96" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="137.33499999999998" cy="96" r="14" fill="#e7a03c"/><text x="137.33499999999998" y="96" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text><text x="137.33499999999998" y="128" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">写真がタイルに並ぶ</text><text x="137.33499999999998" y="150" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">AND THE WINNER IS</text><line x1="238.67" y1="118.0" x2="248.66999999999996" y2="118.0" stroke="#6e645a" stroke-width="2"/><path d="M246.66999999999996 111.0 L258.66999999999996 118.0 L246.66999999999996 125.0 Z" fill="#6e645a"/><rect x="262.66999999999996" y="70" width="194.67" height="96" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><circle cx="360.00499999999994" cy="96" r="14" fill="#e7a03c"/><text x="360.00499999999994" y="96" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text><text x="360.00499999999994" y="128" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">スポットライトが止まる</text><text x="360.00499999999994" y="150" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">受賞した写真の上で</text><line x1="461.3399999999999" y1="118.0" x2="471.3399999999999" y2="118.0" stroke="#6e645a" stroke-width="2"/><path d="M469.3399999999999 111.0 L481.3399999999999 118.0 L469.3399999999999 125.0 Z" fill="#6e645a"/><rect x="485.34" y="70" width="194.67" height="96" rx="10" fill="#ffffff" stroke="#e7a03c" stroke-width="2"/><circle cx="582.675" cy="96" r="14" fill="#e7a03c"/><text x="582.675" y="96" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text><text x="582.675" y="128" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">賞名と撮った人の名前</text><text x="582.675" y="150" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="600" fill="#6e645a" text-anchor="middle" dominant-baseline="central">紙吹雪とともに</text><rect x="60" y="196" width="600" height="46" rx="10" fill="#f5ede1" stroke="#f5ede1" stroke-width="2"/><text x="360" y="219" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2a2420" text-anchor="middle" dominant-baseline="central">賞は前もって作っておき、当日はリモコンのボタンで発表する</text></svg>