<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"><rect width="720" height="410" fill="#fffdf9"/><text x="190" y="44" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">紙の席次表</text><rect x="50" y="80" width="280" height="48" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="190" y="104" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">招待状の返信で人数が変わる</text><line x1="190" y1="130" x2="190" y2="146" stroke="#6e645a" stroke-width="2"/><path d="M183 144 L190 156 L197 144 Z" fill="#6e645a"/><rect x="50" y="158" width="280" height="48" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="190" y="182" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">印刷して入稿する</text><line x1="190" y1="208" x2="190" y2="224" stroke="#6e645a" stroke-width="2"/><path d="M183 222 L190 234 L197 222 Z" fill="#6e645a"/><rect x="50" y="236" width="280" height="48" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="190" y="260" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">直前に欠席の連絡が入る</text><line x1="190" y1="286" x2="190" y2="302" stroke="#6e645a" stroke-width="2"/><path d="M183 300 L190 312 L197 300 Z" fill="#6e645a"/><rect x="50" y="314" width="280" height="48" rx="10" fill="#b5523b" stroke="#b5523b" stroke-width="2"/><text x="190" y="338" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">刷り直しは難しい</text><text x="530" y="44" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">envas の WEB 席次表</text><rect x="390" y="80" width="280" height="48" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="530" y="104" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">招待状の返信で人数が変わる</text><line x1="530" y1="130" x2="530" y2="146" stroke="#6e645a" stroke-width="2"/><path d="M523 144 L530 156 L537 144 Z" fill="#6e645a"/><rect x="390" y="158" width="280" height="48" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="530" y="182" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">タップでゲストの席を入れ替え</text><line x1="530" y1="208" x2="530" y2="224" stroke="#6e645a" stroke-width="2"/><path d="M523 222 L530 234 L537 222 Z" fill="#6e645a"/><rect x="390" y="236" width="280" height="48" rx="10" fill="#ffffff" stroke="#e6dccd" stroke-width="2"/><text x="530" y="260" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#2a2420" text-anchor="middle" dominant-baseline="central">直した内容は自動で保存</text><line x1="530" y1="286" x2="530" y2="302" stroke="#6e645a" stroke-width="2"/><path d="M523 300 L530 312 L537 300 Z" fill="#6e645a"/><rect x="390" y="314" width="280" height="48" rx="10" fill="#6b8f5e" stroke="#6b8f5e" stroke-width="2"/><text x="530" y="338" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">ゲストのスマホにすぐ反映</text><line x1="360" y1="70" x2="360" y2="380" stroke="#e6dccd" stroke-width="2" stroke-dasharray="4 6"/></svg>